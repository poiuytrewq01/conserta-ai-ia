# Spring AI apontando para o Gemini pela API compatível com OpenAI
# Dependência: org.springframework.ai:spring-ai-starter-model-openai
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${LLM_MODELO:gemini-flash-lite-latest}
spring.ai.openai.chat.options.temperature=0

# URL do serviço Python
IA_VISAO_URL=${IA_VISAO_URL:http://localhost:8000}
